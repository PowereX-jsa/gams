name: gams docker build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'images/gams/**'
  push:
    paths:
      - 'images/gams/**'
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      working-directory: "./images/gams"
      TAG: "gams:test"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build test image to verify base image, deployed manually
      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.working-directory }}
          file: ${{ env.working-directory }}/Dockerfile
          load: true
          tags: ${{ env.TAG }}
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Test
        run: |
          echo "${{ secrets.GAMS_LICENSE }}" > gamslice.txt
          docker run --rm \
            -v ${{ github.workspace }}/test-file.gms:/app/test-file.gms \
            -v ${{ github.workspace }}/gamslice.txt:/opt/gams/gamslice.txt \
            ${{ env.TAG }} \
            test-file.gms

      - name: Cleanup
        if: always()
        run: rm -f gamslice.txt
